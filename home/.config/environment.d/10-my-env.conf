# misc
EDITOR=micro

# docker
DOCKER_HOST=unix://$XDG_RUNTIME_DIR/podman/podman.sock
DOCKER_CONFIG=$HOME/.config/docker

# bin paths
PATH=$PATH:$HOME/AppImages:$HOME/.local/bin

# prefer wayland
QT_QPA_PLATFORM=wayland;xcb
CLUTTER_BACKEND=wayland
SDL_VIDEODRIVER=wayland,x11

# bitwarden
BITWARDEN_SSH_AUTH_SOCK=$HOME/.var/app/com.bitwarden.desktop/data/.bitwarden-ssh-agent.sock
SSH_AUTH_SOCK=$HOME/.var/app/com.bitwarden.desktop/data/.bitwarden-ssh-agent.sock

# Intel video decoding
ANV_VIDEO_DECODE=1

# homebrew
HOMEBREW_PREFIX=/home/linuxbrew/.linuxbrew
HOMEBREW_CELLAR=/home/linuxbrew/.linuxbrew/Cellar
HOMEBREW_REPOSITORY=/home/linuxbrew/.linuxbrew/Homebrew
PATH=${PATH:+$PATH:}/home/linuxbrew/.linuxbrew/opt/ffmpeg-full/bin:/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin
INFOPATH=${INFOPATH:+$INFOPATH:}/home/linuxbrew/.linuxbrew/share/info